; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rymcu-esp32-s3-devkitc-1]
platform  = espressif32
board     = rymcu-esp32-s3-devkitc-1
framework = arduino

; Puerto serie para monitor
monitor_speed = 115200

; Librerías necesarias
lib_deps =
    ; EmonLib para cálculo de potencia con SCT-013
    openenergymonitor/EmonLib @ ^1.1.0
    ; ArduinoJson para serializar datos (hacia InfluxDB / WebSocket)
    bblanchon/ArduinoJson @ ^7.0.0
    links2004/WebSockets @ ^2.4.1


; Flags de compilación: aumentar stack del loop() y activar advertencias
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_FREERTOS_UNICORE=0
    ; Stack mínimo recomendado para ESP32-S3 con FreeRTOS
    -DARDUINO_LOOP_STACK_SIZE=8192

; Opciones de upload
upload_speed = 921600